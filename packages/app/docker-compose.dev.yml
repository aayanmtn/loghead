services:
  db:
    image: postgres:18-alpine
    container_name: loghead-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: loghead
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loghead"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  stripe:
    image: stripe/stripe-cli:latest
    container_name: loghead-stripe
    # stripe-cli reads STRIPE_API_KEY — loaded from .env.local via entrypoint wrapper
    entrypoint: sh -c 'STRIPE_API_KEY="$$STRIPE_SECRET_KEY" stripe listen --device-name loghead-dev --forward-to http://host.docker.internal:3000/api/webhooks/stripe'
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data_dev:
